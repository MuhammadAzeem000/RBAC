services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-commtel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env and set it}
      POSTGRES_DB: ${DB_NAME:-rbac_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host on purpose — only backend needs to reach it,
    # over the compose network by service name. Uncomment to inspect it
    # directly with a local client (e.g. psql, a GUI tool):
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-commtel} -d ${DB_NAME:-rbac_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      # Management UI — inspect exchanges/queues/messages at localhost:15672
      # (guest/guest). AMQP port 5672 itself isn't published: only backend
      # and notification-service need it, over the compose network.
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      # Web inbox — every email notification-service sends lands here
      # instead of a real mailbox. SMTP port 1025 isn't published: only
      # notification-service needs it, over the compose network.
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-commtel}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env and set it}
      DB_NAME: ${DB_NAME:-rbac_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required, copy .env.example to .env and set it}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required, copy .env.example to .env and set it}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "4000:4000"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 4100
      NODE_ENV: production
      RABBITMQ_URL: amqp://rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: "${SMTP_FROM:-RBAC Console <noreply@rbac.local>}"
    ports:
      - "4100:4100"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Host port 8080 is deliberately avoided — it's a common default for
      # other local dev stacks (e.g. Apache/XAMPP) and collides easily.
      - "8081:80"

volumes:
  postgres_data:
